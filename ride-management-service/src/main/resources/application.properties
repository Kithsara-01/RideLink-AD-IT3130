spring.application.name=ride-management-service
server.port=8083

spring.config.import=optional:file:.env[.properties]

spring.mongodb.uri=${MONGODB_URI_RIDE}
spring.mongodb.database=ridelink_ride_management_service

app.driver-service.base-url=${DRIVER_SERVICE_URL:http://localhost:8082}
app.driver-service.internal-key=${INTERNAL_SERVICE_KEY}

app.account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}

app.fare-service.base-url=${FARE_SERVICE_URL:http://localhost:8084}
app.fare-service.internal-key=${INTERNAL_SERVICE_KEY}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:ridelink-account-service}
app.jwt.audience=${JWT_AUDIENCE:ridelink-services}