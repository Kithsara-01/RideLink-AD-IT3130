spring.application.name=fare-payment-service
server.port=8084

spring.config.import=optional:file:.env[.properties]

spring.mongodb.uri=${MONGODB_URI_PAYMENT}
spring.mongodb.database=ridelink_fare_payment_service

spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ridelink-account-service
app.jwt.audience=ridelink-services